<!-- Shared Header Component -->
<section class="{{heroClass}}"{{heroId}}>
    <div class="{{heroContainerClass}}">
        <div class="{{heroContentClass}}">
            <h1 class="hero-title">
                {{heroTitle}}
            </h1>
            <p class="hero-description">
                {{heroDescription}}
            </p>
            {{heroAdditionalContent}}
        </div>
        {{heroRightContent}}
    </div>
    {{heroBottomContent}}
</section>
