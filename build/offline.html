<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Resilio Tech</title>
    <link rel="stylesheet" href="/shared/css/common.min.css">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        .offline-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .offline-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
            line-height: 1.6;
            opacity: 0.9;
        }
        .offline-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .offline-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .offline-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        .offline-button.primary {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        .offline-button.primary:hover {
            background: #45a049;
            border-color: #45a049;
        }
        .network-status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
            background: #f44336;
        }
        .status-indicator.online {
            background: #4CAF50;
        }
        .cached-pages {
            margin-top: 2rem;
            text-align: left;
            max-width: 400px;
        }
        .cached-pages h3 {
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }
        .cached-pages ul {
            list-style: none;
            padding: 0;
        }
        .cached-pages li {
            margin: 0.5rem 0;
        }
        .cached-pages a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 0.5rem;
            display: block;
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        .cached-pages a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        @media (max-width: 768px) {
            .offline-title {
                font-size: 2rem;
            }
            .offline-message {
                font-size: 1rem;
            }
            .offline-actions {
                flex-direction: column;
                align-items: center;
            }
            .offline-button {
                width: 100%;
                max-width: 200px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-message">
            It looks like you're not connected to the internet. Don't worry, you can still browse some of our cached content while offline.
        </p>
        <div class="offline-actions">
            <button class="offline-button primary" onclick="location.reload()">
                Try Again
            </button>
            <a href="/" class="offline-button">Go to Homepage</a>
        </div>
        <div class="network-status">
            <span class="status-indicator" id="statusIndicator"></span>
            <span id="statusText">Checking connection...</span>
        </div>
        <div class="cached-pages">
            <h3>Available Offline Pages</h3>
            <ul>
                <li><a href="/">Homepage</a></li>
                <li><a href="/projects/">Projects</a></li>
                <li><a href="/resources/">Resources</a></li>
                <li><a href="/blog/">Blog</a></li>
            </ul>
        </div>
    </div>
    <script>
        // Network status monitoring
        function updateNetworkStatus() {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            if (navigator.onLine) {
                indicator.classList.add('online');
                statusText.textContent = 'Connection restored!';
                // Auto-reload after 2 seconds when back online
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                indicator.classList.remove('online');
                statusText.textContent = 'No internet connection';
            }
        }
        // Listen for network changes
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        // Initial check
        updateNetworkStatus();
        // Periodic connection check
        setInterval(() => {
            // Try to fetch a small resource to check connectivity
            fetch('/manifest.json', { 
                method: 'HEAD',
                cache: 'no-cache' 
            })
            .then(() => {
                if (!navigator.onLine) {
                    // Force online status if fetch succeeds
                    window.dispatchEvent(new Event('online'));
                }
            })
            .catch(() => {
                // Connection failed
                if (navigator.onLine) {
                    window.dispatchEvent(new Event('offline'));
                }
            });
        }, 5000);
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                location.reload();
            }
            if (e.key === 'h' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
