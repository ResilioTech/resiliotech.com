<!-- Multi-Brand Header Component -->
<header class="site-header" role="banner">
    <div class="container">
        <div class="header-content">
            <!-- Brand Logo & Switcher -->
            <div class="header-left">
                <div class="brand-logo">
                    <a href="/" class="logo-link">
                        <span class="logo-text">{{brandName}}</span>
                    </a>
                </div>
                
                <!-- Brand Switcher Dropdown -->
                <div class="brand-switcher" id="brand-switcher">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
            
            <!-- Main Navigation -->
            <nav class="brand-navigation" role="navigation" aria-label="Main navigation">
                <!-- Populated by JavaScript based on current brand -->
            </nav>
            
            <!-- Header Actions -->
            <div class="header-actions">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle mobile menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobile-menu-overlay">
        <div class="mobile-menu-content">
            <div class="mobile-menu-header">
                <div class="mobile-brand-logo">{{brandName}}</div>
                <button class="mobile-menu-close" id="mobile-menu-close" aria-label="Close mobile menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <!-- Mobile Navigation -->
            <nav class="mobile-navigation" role="navigation">
                {{navigation}}
            </nav>
            
            <!-- Mobile Brand Switcher -->
            <div class="mobile-brand-switcher">
                <div class="mobile-switcher-label">Switch to:</div>
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>
</header>

<!-- Header Styles -->
<style>
/* Site Header */
.site-header {
    background: white;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 1000;
    transition: all 0.3s ease;
}

.site-header.scrolled {
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
}

.header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 0;
    gap: 2rem;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 2rem;
    flex-shrink: 0;
}

.brand-logo .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 700;
    font-size: 1.25rem;
    transition: color 0.2s ease;
}

.brand-logo .logo-link:hover {
    color: var(--brand-primary);
}

.logo-text {
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* Header Actions */
.header-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.mobile-menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.mobile-menu-toggle:hover {
    background: var(--background-light);
    color: var(--brand-primary);
}

/* Mobile Menu */
.mobile-menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 10000;
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.mobile-menu-overlay.show {
    display: flex;
    opacity: 1;
}

.mobile-menu-content {
    background: white;
    width: 100%;
    max-width: 400px;
    height: 100vh;
    margin-left: auto;
    padding: 2rem;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 2rem;
}

.mobile-menu-overlay.show .mobile-menu-content {
    transform: translateX(0);
}

.mobile-menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border-color);
}

.mobile-brand-logo {
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--text-primary);
    background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.mobile-menu-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 6px;
    transition: all 0.2s ease;
}

.mobile-menu-close:hover {
    background: var(--background-light);
    color: var(--text-primary);
}

/* Mobile Navigation */
.mobile-navigation {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.mobile-navigation .nav-link,
.mobile-navigation .footer-nav-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
    color: var(--text-primary);
    text-decoration: none;
    border-radius: 8px;
    transition: all 0.2s ease;
    font-weight: 500;
}

.mobile-navigation .nav-link:hover,
.mobile-navigation .footer-nav-link:hover {
    background: var(--background-light);
    color: var(--brand-primary);
}

.mobile-navigation .nav-link.active {
    background: rgba(99, 102, 241, 0.1);
    color: var(--brand-primary);
}

/* Mobile Brand Switcher */
.mobile-brand-switcher {
    margin-top: auto;
    padding-top: 2rem;
    border-top: 1px solid var(--border-color);
}

.mobile-switcher-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 1rem;
}

/* Responsive Design */
@media (max-width: 1024px) {
    .brand-navigation {
        display: none;
    }
    
    .mobile-menu-toggle {
        display: flex;
    }
}

@media (max-width: 768px) {
    .header-content {
        padding: 0.75rem 0;
        gap: 1rem;
    }
    
    .header-left {
        gap: 1rem;
    }
    
    .brand-switcher {
        display: none;
    }
    
    .logo-text {
        font-size: 1.125rem;
    }
}

@media (max-width: 480px) {
    .mobile-menu-content {
        padding: 1.5rem;
        max-width: 100%;
    }
}

/* Header scroll behavior */
@media (prefers-reduced-motion: no-preference) {
    .site-header {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
}

/* High contrast mode support */
@media (prefers-contrast: high) {
    .site-header {
        border-bottom-width: 2px;
    }
    
    .mobile-menu-toggle,
    .mobile-menu-close {
        border: 1px solid currentColor;
    }
}
</style>

<!-- Header JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const header = document.querySelector('.site-header');
    const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
    const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
    const mobileMenuClose = document.getElementById('mobile-menu-close');
    
    // Header scroll effect
    let lastScrollY = window.scrollY;
    
    function updateHeaderOnScroll() {
        const currentScrollY = window.scrollY;
        
        if (currentScrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
        
        lastScrollY = currentScrollY;
    }
    
    window.addEventListener('scroll', updateHeaderOnScroll, { passive: true });
    
    // Mobile menu toggle
    function openMobileMenu() {
        mobileMenuOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    
    function closeMobileMenu() {
        mobileMenuOverlay.classList.remove('show');
        document.body.style.overflow = '';
    }
    
    if (mobileMenuToggle) {
        mobileMenuToggle.addEventListener('click', openMobileMenu);
    }
    
    if (mobileMenuClose) {
        mobileMenuClose.addEventListener('click', closeMobileMenu);
    }
    
    // Close mobile menu on overlay click
    mobileMenuOverlay.addEventListener('click', function(e) {
        if (e.target === mobileMenuOverlay) {
            closeMobileMenu();
        }
    });
    
    // Close mobile menu on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mobileMenuOverlay.classList.contains('show')) {
            closeMobileMenu();
        }
    });
    
    // Handle navigation link clicks in mobile menu
    document.addEventListener('click', function(e) {
        if (e.target.matches('.mobile-navigation .nav-link') || 
            e.target.matches('.mobile-navigation .footer-nav-link')) {
            closeMobileMenu();
        }
    });
});
</script>
