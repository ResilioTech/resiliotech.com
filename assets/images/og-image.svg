<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main content container -->
  <g transform="translate(60, 140)">
    <!-- Logo/Brand Mark -->
    <circle cx="60" cy="60" r="45" fill="#ffffff" filter="url(#shadow)"/>
    <text x="60" y="72" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#2563eb">R</text>
    
    <!-- Main heading -->
    <text x="140" y="45" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#shadow)">
      DevOps Automation for Startups
    </text>
    
    <!-- Subheading -->
    <text x="140" y="85" font-family="Arial, sans-serif" font-size="28" fill="#e2e8f0">
      Launch faster with resilient infrastructure, frictionless CI/CD, and observability
    </text>
    
    <!-- Key benefits -->
    <g transform="translate(140, 150)">
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="8" fill="#10b981"/>
        <text x="32" y="18" font-family="Arial, sans-serif" font-size="20" fill="#f1f5f9">No full-time DevOps hire needed</text>
      </g>
      <g transform="translate(0, 45)">
        <circle cx="12" cy="12" r="8" fill="#10b981"/>
        <text x="32" y="18" font-family="Arial, sans-serif" font-size="20" fill="#f1f5f9">Purpose-built for early-stage startups</text>
      </g>
      <g transform="translate(0, 90)">
        <circle cx="12" cy="12" r="8" fill="#10b981"/>
        <text x="32" y="18" font-family="Arial, sans-serif" font-size="20" fill="#f1f5f9">Expert CI/CD, infrastructure automation & monitoring</text>
      </g>
    </g>
    
    <!-- Website URL -->
    <text x="140" y="320" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
      resiliotech.com
    </text>
  </g>
  
  <!-- Tech stack icons on the right -->
  <g transform="translate(800, 150)">
    <rect x="0" y="0" width="320" height="280" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Tech Stack We Master
    </text>
    
    <!-- Icons grid (simplified as circles with letters) -->
    <g transform="translate(40, 60)">
      <g>
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">K8s</text>
      </g>
      <g transform="translate(70, 0)">
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Docker</text>
      </g>
      <g transform="translate(140, 0)">
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">AWS</text>
      </g>
      <g transform="translate(210, 0)">
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Terraform</text>
      </g>
    </g>
    
    <g transform="translate(40, 140)">
      <g>
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Jenkins</text>
      </g>
      <g transform="translate(70, 0)">
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">GitOps</text>
      </g>
      <g transform="translate(140, 0)">
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Monitor</text>
      </g>
      <g transform="translate(210, 0)">
        <circle cx="30" cy="30" r="25" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="30" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Grafana</text>
      </g>
    </g>
  </g>
</svg>