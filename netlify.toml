[build]
  # Static site - no build required
  publish = "."
  
# Disable all build processing
[build.processing]
  skip_processing = false
  
# Disable automatic framework detection
[build.environment]
  NODE_ENV = "production"

[[redirects]]
  # Handle 404 errors with custom 404.html page
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  # Cache static assets
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Security headers
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Don't build, just deploy the static files
[build.ignore]
  command = "exit 0"
